name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version to publish, e.g. v2.0.0 (the tag is created on the selected branch if it doesn't exist)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Current Go: older toolchains produce macOS binaries that new macOS refuses to load.
          go-version: stable
      - name: Test
        run: |
          go vet ./...
          go test ./...
      - name: Build all platforms
        run: scripts/build.sh "$TAG"
      - name: Release notes
        run: |
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.tar.gz dist/betterdecompiler.lua dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.tar.gz dist/betterdecompiler.lua dist/SHA256SUMS.txt \
              --title "BetterDecompiler $TAG" --notes-file notes.md --latest --target "$GITHUB_SHA"
          fi
